[tool.poetry]
name = "pygame-extend"
version = "0.1.0"
description = "Minimal logic/render-separated game loop toolkit for pygame-ce projects"
readme = "README.md"
authors = ["Inte Vleminckx <inte.vleminckx14@hotmail.com>"]
repository = "https://github.com/InteVleminckx/pygame-extend"
packages = [{ include = "pygext", from = "src" }]

[tool.poetry.dependencies]
python = "^3.14"
pygame-ce = { version = "^2.5", optional = true }

[tool.poetry.extras]
pygame = ["pygame-ce"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pygame-ce = "^2.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
